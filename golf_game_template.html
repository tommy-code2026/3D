<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <title>101 日常漫遊 | Taipei Walk</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#153d38; --paper:#f6faf3; --lime:#d8f28b; --line:#ffffff42; }
    * { box-sizing:border-box; letter-spacing:0; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:'DM Sans','Noto Sans TC',sans-serif; background:#acd9eb; color:var(--ink); }
    canvas#world { width:100%; height:100%; display:block; touch-action:none; }
    button,input { font:inherit; }
    button { cursor:pointer; color:inherit; border:0; border-radius:4px; background:var(--paper); min-height:42px; padding:10px 16px; }
    button:hover { filter:brightness(.95); }
    button:focus-visible { outline:3px solid #d5f17e; outline-offset:3px; }
    button:disabled { opacity:.45; cursor:default; }
    .glass { background:#173f38db; color:var(--paper); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:6px; }
    header { position:fixed; top:24px; left:28px; pointer-events:none; text-shadow:0 2px 6px #17372b70; color:white; }
    header small { font-size:10px; font-weight:700; }
    h1 { font-size:24px; margin:4px 0; font-weight:700; }
    #district { font-size:12px; opacity:.9; }
    #status { position:fixed; top:26px; right:28px; display:flex; align-items:center; gap:14px; padding:10px 14px; font-size:12px; }
    .icon { width:42px; height:42px; padding:10px; display:grid; place-items:center; }
    .icon svg { width:20px; height:20px; }
    #tools { position:fixed; right:28px; bottom:26px; display:flex; gap:8px; }
    #mapbox { position:fixed; left:28px; bottom:26px; padding:9px; }
    #map { display:block; width:170px; height:140px; }
    #mapbox footer { display:flex; justify-content:space-between; padding:5px 3px 1px; font-size:10px; }
    #crosshair { position:fixed; top:50%; left:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px #0005; pointer-events:none; }
    #enter { position:fixed; left:50%; bottom:36px; transform:translateX(-50%); background:var(--lime); font-size:12px; }
    #enter[hidden] { display:none; }
    #interact { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--lime); min-width:180px; box-shadow:0 4px 24px #163a3530; }
    #interact[hidden] { display:none; }
    #objective { position:fixed; top:105px; right:28px; padding:10px 14px; font-size:12px; max-width:230px; }
    #toast { position:fixed; top:115px; left:50%; transform:translateX(-50%) translateY(-12px); padding:12px 22px; background:var(--lime); border-radius:4px; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; font-size:13px; max-width:80%; text-align:center; }
    #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
    #loading { position:fixed; inset:0; display:grid; place-items:center; background:#e5efdf; z-index:20; }
    #loading div { text-align:center; }
    #loading strong { font-size:26px; display:block; margin-bottom:12px; }
    #loading span { font-size:12px; }
    #dialog { border:0; border-radius:6px; padding:0; color:var(--ink); background:var(--paper); width:min(520px,calc(100% - 32px)); max-height:80dvh; box-shadow:0 30px 100px #0f33295c; }
    #dialog::backdrop { background:#0c2e3059; backdrop-filter:blur(3px); }
    .dialog-head { display:flex; align-items:center; justify-content:space-between; padding:22px 24px 12px; border-bottom:1px solid #163f3818; gap:12px; }
    #dialog h2 { font-size:20px; margin:0; }
    #dialog-role { font-size:11px; color:#618074; margin-top:5px; }
    #dialog-content { padding:20px 24px 24px; line-height:1.75; font-size:14px; }
    #dialog-content p { margin:0 0 16px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    .actions button { background:#e3eddf; font-size:13px; }
    .actions button.primary { background:#234f42; color:white; }
    .journal-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #173b3114; }
    .journal-row span { flex:1; }
    .journal-row small { font-size:11px; color:#617966; }
    .journal-row button { padding:6px 12px; background:#e3eddf; font-size:12px; }
    #cards { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    #cards button { aspect-ratio:1; padding:0; font-size:21px; background:#224e40; color:white; }
    #cards button.matched { background:#d3e8b3; color:#325b41; }
    input[type=range] { width:100%; accent-color:#30704c; }
    .touch { display:none; }
    body[data-paused=true] #crosshair { opacity:.3; }
    @media(pointer:coarse) { .touch { display:block; } }
    @media(max-width:600px) {
      header { top:18px; left:18px; } h1 { font-size:20px; }
      #status { top:20px; right:16px; padding:8px 10px; gap:8px; font-size:10px; }
      #mapbox { left:16px; bottom:246px; padding:5px; } #map { width:112px; height:94px; }
      #tools { right:16px; bottom:20px; } #objective { top:91px; right:16px; max-width:175px; font-size:10px; }
      #interact { bottom:168px; font-size:12px; } #toast { top:145px; font-size:12px; } #enter { display:none; }
      #mapbox footer { font-size:9px; } .dialog-head { padding:16px; } #dialog-content { padding:16px; }
    }
    #movement { position:fixed; left:18px; bottom:22px; width:136px; height:136px; }
    #movement button { position:absolute; width:44px; height:44px; background:#f6faf3b8; padding:12px; touch-action:none; }
    #movement button svg { width:20px; height:20px; }
    #movement [data-key=KeyW] { left:46px; top:0; } #movement [data-key=KeyS] { left:46px; bottom:0; }
    #movement [data-key=KeyA] { left:0; top:46px; } #movement [data-key=KeyD] { right:0; top:46px; }
    #jump { position:fixed; right:20px; bottom:82px; background:#f6faf3b8; touch-action:none; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
  <canvas id="world" aria-label="台北101第一人稱探索遊戲"></canvas>
  <header><small>TAIPEI WALK / 01</small><h1>101 日常漫遊</h1><span id="district">信義生活圈</span></header>
  <div id="status" class="glass"><span id="coins">80 金幣</span><span id="progress">0 / 6 區域</span></div>
  <div id="objective" class="glass">探索信義生活圈</div>
  <div id="crosshair"></div>
  <button id="enter">開始探索</button>
  <div id="mapbox" class="glass"><canvas id="map" width="340" height="280" aria-label="區域小地圖"></canvas><footer><span>TAIPEI 101</span><span id="heading">N</span></footer></div>
  <button id="interact" hidden></button>
  <nav id="tools"><button id="journal" class="icon glass" title="探索手帳" aria-label="探索手帳"><i data-lucide="notebook-pen"></i></button><button id="pause" class="icon glass" title="暫停" aria-label="暫停"><i data-lucide="pause"></i></button><button id="fullscreen" class="icon glass" title="全螢幕" aria-label="全螢幕"><i data-lucide="expand"></i></button></nav>
  <div id="movement" class="touch" aria-label="移動"><button data-key="KeyW" aria-label="前進"><i data-lucide="arrow-up"></i></button><button data-key="KeyS" aria-label="後退"><i data-lucide="arrow-down"></i></button><button data-key="KeyA" aria-label="左移"><i data-lucide="arrow-left"></i></button><button data-key="KeyD" aria-label="右移"><i data-lucide="arrow-right"></i></button></div>
  <button id="jump" class="touch icon" title="跳躍" aria-label="跳躍"><i data-lucide="chevrons-up"></i></button>
  <div id="toast" role="status"></div>
  <div id="loading"><div><strong>101 日常漫遊</strong><span id="load-message">正在準備城市與居民…</span></div></div>
  <dialog id="dialog"><div class="dialog-head"><div><h2 id="dialog-title"></h2><div id="dialog-role"></div></div><button id="close-dialog" class="icon" title="關閉" aria-label="關閉"><i data-lucide="x"></i></button></div><div id="dialog-content"></div></dialog>
  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { createIcons, NotebookPen, Pause, Expand, ArrowUp, ArrowDown, ArrowLeft, ArrowRight, ChevronsUp, X } from 'https://esm.sh/lucide@0.468.0';

    createIcons({ icons:{NotebookPen,Pause,Expand,ArrowUp,ArrowDown,ArrowLeft,ArrowRight,ChevronsUp,X} });
    const $ = selector => document.querySelector(selector);
    const canvas = $('#world');
    const renderer = new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.BasicShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.03;
    const scene=new THREE.Scene();
    scene.background=new THREE.Color('#b6dff0');
    scene.fog=new THREE.Fog('#b6dff0',130,370);
    const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.08,650);
    const controls=new PointerLockControls(camera,canvas);
    scene.add(new THREE.HemisphereLight('#fff8e4','#4d714b',2.1));
    const sun=new THREE.DirectionalLight('#fff3ce',2.7);
    sun.position.set(-65,120,45);sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    Object.assign(sun.shadow.camera,{left:-105,right:105,top:100,bottom:-100,near:1,far:300});
    sun.shadow.normalBias=.12;scene.add(sun);

    const physics=new CANNON.World({gravity:new CANNON.Vec3(0,-18,0)});
    physics.broadphase=new CANNON.SAPBroadphase(physics);
    physics.defaultContactMaterial.friction=0;
    const player=new CANNON.Body({mass:70,shape:new CANNON.Sphere(.42),fixedRotation:true,linearDamping:.2});
    player.position.set(0,.5,55);physics.addBody(player);
    camera.position.set(0,1.78,55);camera.lookAt(0,24,0);
    const keys=new Set();
    const clock=new THREE.Clock();
    const npcs=[];
    const interactions=[];
    const waterAreas=[];
    const collisionBoxes=[];
    const terrainMeshes=[];
    const terrainRay=new THREE.Raycaster();
    const regionLabels=[];
    const worldData=__WORLD_DATA__;
    let paused=false, ready=false, nearby=null, gameTime=0, toastTimer, selectedZone=null;
    let progress={coins:80,visited:[],purchases:[],rewards:[]};
    try {const saved=JSON.parse(localStorage.getItem('taipei-walk-v1'));if(saved&&Array.isArray(saved.visited)&&Number.isFinite(saved.coins))progress={...progress,...saved};}catch{}
    const regions=[
      {id:'plaza',name:'101 廣場',x:0,z:24,radius:14,color:'#e6c46c'},
      {id:'shops',name:'信義購物街',x:0,z:47,radius:13,color:'#efaaa7'},
      {id:'office',name:'綠意共享辦公室',x:-22,z:-16,radius:12,color:'#b9b8ed'},
      {id:'river',name:'湖畔景觀橋',x:58,z:-8.4,radius:15,color:'#80d2e7'},
      {id:'golf',name:'東側高爾夫球場',x:74,z:9,radius:16,color:'#c4df78'},
      {id:'games',name:'午後遊戲草坪',x:-65,z:8,radius:13,color:'#f2ad78'}
    ];
    function save(){try{localStorage.setItem('taipei-walk-v1',JSON.stringify(progress));}catch{}updateHud();}
    function updateHud(){$('#coins').textContent=`${progress.coins} 金幣`;$('#progress').textContent=`${progress.visited.length} / 6 區域`;}
    function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3500);}
    function reward(id,amount){if(progress.rewards.includes(id))return false;progress.rewards.push(id);progress.coins+=amount;save();toast(`完成活動 · +${amount} 金幣`);return true;}
    const mats={};
    function mat(color,roughness=.8){if(!mats[color])mats[color]=new THREE.MeshStandardMaterial({color,roughness});return mats[color];}
    function mesh(geometry,color,parent=scene){const result=new THREE.Mesh(geometry,typeof color==='string'?mat(color):color);result.castShadow=true;result.receiveShadow=true;parent.add(result);return result;}
    function box(x,y,z,width,height,depth,color,parent=scene){const result=mesh(new THREE.BoxGeometry(width,height,depth),color,parent);result.position.set(x,y,z);return result;}
    function solidBox(x,y,z,width,height,depth,rotation=0){const body=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(width/2,height/2,depth/2))});body.position.set(x,y,z);body.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),rotation);physics.addBody(body);collisionBoxes.push(body);return body;}
    function sphere(x,y,z,radius,color,parent=scene){const result=mesh(new THREE.SphereGeometry(radius,12,8),color,parent);result.position.set(x,y,z);return result;}
    const hands=new THREE.Group();camera.add(hands);scene.add(camera);
    for(const side of [-1,1]){const sleeve=box(side*.29,-.40,-.48,.13,.32,.14,'#5e8c81',hands);sleeve.rotation.x=-.35;sphere(side*.29,-.28,-.54,.065,'#d7a47f',hands);}
    hands.traverse(object=>{if(object.isMesh){object.castShadow=false;object.receiveShadow=false;}});
    function label(text,x,y,z,scale=3.5){const image=document.createElement('canvas');image.width=512;image.height=128;const ctx=image.getContext('2d');ctx.fillStyle='#194739e8';ctx.beginPath();ctx.roundRect(2,2,508,124,12);ctx.fill();ctx.font='600 42px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff9e8';ctx.fillText(text,256,64);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(image),depthTest:true}));sprite.position.set(x,y,z);sprite.scale.set(scale,scale/4,1);scene.add(sprite);return sprite;}
    function road(points,width=3,color='#d0c9ad',height=.025){const curve=new THREE.CatmullRomCurve3(points.map(([x,z])=>new THREE.Vector3(x,height,z)));const vertices=[],indices=[];for(let step=0;step<=100;step++){const point=curve.getPoint(step/100),tangent=curve.getTangent(step/100);const normal=new THREE.Vector3(-tangent.z,0,tangent.x).normalize().multiplyScalar(width/2);vertices.push(point.x+normal.x,height,point.z+normal.z,point.x-normal.x,height,point.z-normal.z);if(step<100){const index=step*2;indices.push(index,index+2,index+1,index+1,index+2,index+3);}}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setIndex(indices);geometry.computeVertexNormals();return mesh(geometry,color);}
    function bench(x,z,rotation=0){const group=new THREE.Group();group.position.set(x,0,z);group.rotation.y=rotation;scene.add(group);box(0,.5,0,2.1,.15,.65,'#8b6545',group);box(0,.96,-.3,2.1,.7,.12,'#8b6545',group);for(const side of [-.8,.8])box(side,.25,0,.12,.5,.5,'#3b5f51',group);}
    function lamp(x,z){box(x,2,z,.09,4,.09,'#385349');const globe=sphere(x,4,z,.22,'#fff0bb');globe.material=mat('#fff0bb').clone();globe.material.emissive.set('#efc96b');globe.material.emissiveIntensity=.4;}
    function buildLandscape(){
      const floor=mesh(new THREE.CylinderGeometry(1,1,.3,96),'#83a74c');floor.scale.set(106,1,86);floor.position.y=-.2;
      solidBox(0,-1,0,220,2,180);
      solidBox(0,4.6,0,25,8,21.5);
      for(const entry of worldData.buildings)solidBox(...entry.position,...entry.size);
      road([[0,15],[0,30],[0,46],[0,63]],7);
      const ring=[];for(let step=0;step<=64;step++){const angle=step*Math.PI*2/64;ring.push([45*Math.cos(angle),37*Math.sin(angle)]);}road(ring,3.8);
      road([[0,38],[22,31],[42,13],[46,0],[64,0],[74,9],[88,20]],3.6);
      road([[0,38],[-24,34],[-43,22],[-65,8],[-82,-4]],3.5);
      road([[-42,12],[-40,-6],[-22,-16],[-10,-24],[0,-38]],3.4);
      road([[42,13],[58,10],[58,-8.4],[58,-28],[43,-36]],3.4);
      for(let hole=0;hole<18;hole++){if(hole===4||hole===13)continue;const angle=hole*Math.PI*2/18+Math.PI/18;waterAreas.push({x:58.5*Math.cos(angle),z:-48.5*Math.sin(angle),angle:-angle-Math.PI/2});}
      const bridgeZ=-8.42;
      box(58,1.4,bridgeZ,3.6,.3,24,'#ad8055');solidBox(58,1.4,bridgeZ,3.6,.3,24);
      for(const side of [-1,1]){
        for(let index=0;index<=12;index++)box(58+side*1.67,2.05,bridgeZ-12+index*2,.1,1.1,.1,'#674b39');
        box(58+side*1.67,2.52,bridgeZ,.12,.12,24,'#674b39');
      }
      for(const side of [-1,1]){
        const ramp=box(58,.7,bridgeZ+side*15,3.6,.18,6.3,'#ad8055');
        ramp.rotation.x=side*.25;solidBox(58,.7,bridgeZ+side*15,3.6,.18,6.3,side*.25);
      }
      for(let step=0;step<24;step++)box(58,1.56,bridgeZ-11.5+step,3.4,.025,.04,'#74523c');
      for(const [x,z,rotation] of [[-5,24,0],[5,24,0],[62,-18,Math.PI/2],[-61,13,0],[8,58,0]])bench(x,z,rotation);
      for(let step=0;step<12;step++){const angle=step*Math.PI*2/12;lamp(43*Math.cos(angle),35*Math.sin(angle));}
      for(let step=0;step<10;step++){const angle=step*Math.PI*2/10;const hill=mesh(new THREE.SphereGeometry(1,14,8),step%2?'#72977f':'#8ba591');hill.position.set(230*Math.cos(angle),12,220*Math.sin(angle));hill.scale.set(45,25+step%3*12,32);}
      for(let step=0;step<12;step++){const cloud=new THREE.Group();cloud.position.set(Math.sin(step*13)*160,100+step%3*12,Math.cos(step*9)*150);scene.add(cloud);for(let part=0;part<3;part++){const puff=sphere(part*8,Math.sin(part)*2,0,8,'#fffdf1',cloud);puff.scale.set(1.7,.45,.8);puff.castShadow=false;}}
      label('TAIPEI 101',0,7,12,8);
      for(const region of regions)regionLabels.push(label(region.name,region.x,4.2,region.z,4.5));
    }
    function buildShops(){
      const names=['山嵐咖啡','城市選物','花日小舖'];
      const colors=['#c67b65','#e6c76f','#799998'];
      for(let index=0;index<3;index++)for(const side of [-1,1]){
        const x=side*9,z=38+index*8;
        box(x,1.6,z,5,3.2,5,'#f1e8cd');solidBox(x,1.6,z,5,3.2,5);
        box(x,3.35,z,6,.22,6,colors[index]);
        box(x-side*2.52,1.5,z,.04,1.7,3.5,'#456c69');
        for(let stripe=0;stripe<6;stripe++)box(x-side*2.9,2.65,z-2.1+stripe*.8,1.2,.12,.76,stripe%2?'#fcf3dc':colors[index]);
        label(names[index],x,3.9,z,3.5);
      }
      for(const side of [-1,1])for(let index=0;index<3;index++){const x=side*4.8,z=40+index*8;box(x,.5,z,1.2,1,1.2,'#b3b38b');const tree=sphere(x,2.1,z,1.1,'#47764b');tree.scale.y=1.4;}
    }
    function buildOffice(){
      box(-22,.1,-16,13,.2,10,'#c7c7af');
      box(-22,3.1,-16,14,.2,11,'#577c68');
      for(const x of [-28,-16])for(const z of [-20,-12]){box(x,1.55,z,.16,3.1,.16,'#547564');solidBox(x,1.55,z,.2,3.1,.2);}
      for(let index=0;index<4;index++){const x=-26+index*2.6;box(x,.78,-17,1.9,.12,1,'#e1c49b');box(x,.37,-17,.16,.74,.5,'#52695f');box(x,1.2,-17.2,.95,.6,.07,'#364c54');box(x,.85,-16.8,.65,.04,.22,'#657c80');box(x,.45,-15.8,.7,.12,.65,'#677f68');}
      solidBox(-22,.45,-17,12,.9,1.1);
      label('OPEN STUDIO',-22,3.65,-16,5);
    }
    function makePerson(name,role,x,z,color,activity='idle',path=null){
      const root=new THREE.Group();root.position.set(x,0,z);scene.add(root);
      const torso=box(0,1.13,0,.42,.55,.25,color,root);
      box(0,.82,0,.35,.15,.25,'#354650',root);
      sphere(0,1.66,0,.17,'#d7a47f',root);
      for(const side of [-1,1])box(side*.055,1.68,.154,.024,.027,.014,'#343c39',root);
      sphere(0,1.63,.163,.025,'#d7a47f',root);
      const hair=sphere(0,1.75,-.025,.17,'#3e332f',root);hair.scale.y=.55;
      const arms=[],legs=[];
      for(const side of [-1,1]){
        const arm=new THREE.Group();arm.position.set(side*.28,1.37,0);root.add(arm);box(0,-.22,0,.14,.42,.15,color,arm);sphere(0,-.46,0,.073,'#d7a47f',arm);arms.push(arm);
        const leg=new THREE.Group();leg.position.set(side*.105,.78,0);root.add(leg);box(0,-.28,0,.16,.56,.18,'#394d59',leg);box(0,-.6,.04,.18,.12,.29,'#eef0dc',leg);legs.push(leg);

    $('#pause').addEventListener('click',()=>{openDialog('暫停漫遊','TAIPEI WALK','');actions().append(action('繼續探索',closeDialog,true),action('探索手帳',showJournal),action('返回購物街',()=>{player.position.set(0,.5,55);player.velocity.set(0,0,0);camera.lookAt(0,10,0);closeDialog();}));});
    $('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('目前瀏覽器不支援全螢幕');}});
    addEventListener('keydown',event=>{if($('#dialog').open)return;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code))event.preventDefault();keys.add(event.code);if(event.code==='Space'&&!event.repeat)jump();if(event.code==='KeyE'&&!event.repeat)interact();if(event.code==='KeyM'&&!event.repeat)showJournal();});
    addEventListener('keyup',event=>keys.delete(event.code));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());
    controls.addEventListener('unlock',()=>keys.clear());
    controls.addEventListener('lock',()=>$('#enter').hidden=true);
    controls.addEventListener('unlock',()=>$('#enter').hidden=false);
    document.addEventListener('pointerlockerror',()=>{$('#enter').hidden=true;toast('已切換為拖曳視角');});
    $('#enter').addEventListener('click',()=>{try{controls.lock();}catch{}$('#enter').hidden=true;});
    let pointer=null;
    canvas.addEventListener('pointerdown',event=>{if(paused||!ready)return;pointer={id:event.pointerId,x:event.clientX,y:event.clientY,moved:false};canvas.setPointerCapture(event.pointerId);});
    canvas.addEventListener('pointermove',event=>{if(!pointer||controls.isLocked||paused)return;const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;pointer.moved||=Math.abs(dx)+Math.abs(dy)>3;const rotation=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');rotation.y-=dx*.003;rotation.x=THREE.MathUtils.clamp(rotation.x-dy*.003,-Math.PI*.48,Math.PI*.48);camera.quaternion.setFromEuler(rotation);pointer.x=event.clientX;pointer.y=event.clientY;});
    canvas.addEventListener('pointerup',event=>{if(pointer&&!pointer.moved&&event.pointerType==='mouse'&&!paused){try{controls.lock();}catch{}}pointer=null;});
    for(const button of document.querySelectorAll('[data-key]')){button.addEventListener('pointerdown',event=>{event.preventDefault();button.setPointerCapture(event.pointerId);keys.add(button.dataset.key);});for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,()=>keys.delete(button.dataset.key));}
    $('#jump').addEventListener('pointerdown',jump);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    buildLandscape();buildShops();buildOffice();buildResidents();batchScenery();batchActors();updateHud();
    const modelData='__MODEL_DATA__';
    const binary=Uint8Array.from(atob(modelData),character=>character.charCodeAt(0)).buffer;
    new GLTFLoader().parse(binary,'',gltf=>{const model=gltf.scene;model.scale.setScalar(10);model.position.y=-3.4;model.traverse(object=>{if(object.isMesh){object.castShadow=true;object.receiveShadow=true;}});scene.add(model);installTerrain(model);renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;ready=true;$('#loading').remove();document.body.dataset.ready='true';window.__taipeiGame={scene,camera,renderer,physics,player,npcs,regions,progress,interactions,collisionBoxes,waterAreas,golfBall,hole,controls,showJournal,talk,startCards,showGolf,keys,terrainMeshes};},error=>{$('#load-message').textContent='模型載入失敗，請重新整理頁面。';console.error(error);});
    let hudTime=0;
    renderer.setAnimationLoop(()=>{const delta=Math.min(clock.getDelta(),.1);if(!ready){renderer.render(scene,camera);return;}if(!paused){gameTime+=delta;movePlayer(delta);updateResidents();syncActors();updateGolf(delta);}hudTime+=delta;if(hudTime>.12){hudTime=0;nearestInteraction();explore();drawMap();}renderer.render(scene,camera);});
  </script>
</body>
</html>
